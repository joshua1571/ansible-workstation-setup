---
- name: Install Source Code Pro (Debian family)
  ansible.builtin.include_tasks: adobe_source_code_pro_Debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install Source Code Pro (Red Hat family)
  ansible.builtin.include_tasks: adobe_source_code_pro_RedHat.yml
  when: ansible_facts['os_family'] == "RedHat"