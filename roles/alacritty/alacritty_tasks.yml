- name: Install alacritty
  become: true
  ansible.builtin.package:
    name:
      - alacritty
    state: present

- name: Create alacritty config folder
  ansible.builtin.file:
    path: "/home/{{ workstation_user }}/.config/alacritty"
    state: directory
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: '0755'

- name: Add alacritty config
  ansible.builtin.copy:
    dest: /home/{{ workstation_user }}/.config/alacritty/alacritty.yml
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: '0644'
    backup: true
    content: |
      window:
        decorations: full
        title: Alacritty
        dynamic_title: true
        opacity: 0.85
                  font:
        normal:
          family: monospace
          style: Source Code Pro
        size: 12.0
      colors:
        primary:
          background: '0x282828'
          foreground: '0xebdbb2'
        normal:
          black:   '0x282828'
          red:     '0xcc241d'
          green:   '0x98971a'
          yellow:  '0xd79921'
          blue:    '0x458588'
          magenta: '0xb16286'
          cyan:    '0x689d6a'
          white:   '0xa89984'
        bright:
          black:   '0x928374'
          red:     '0xfb4934'
          green:   '0xb8bb26'
          yellow:  '0xfabd2f'
          blue:    '0x83a598'
          magenta: '0xd3869b'
          cyan:    '0x8ec07c'
          white:   '0xebdbb2'
      bell:
        duration: 125
        color: '#cccccc'
      live_config_reload: true
