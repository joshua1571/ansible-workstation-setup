#!/usr/bin/ansible-playbook --ask-become-pass
---
- name: Configure host
  hosts: localhost
  connection: local

  vars:
    workstation_user: jrh
    workstation_group: jrh
    hostname: test-laptop

    # Current platforms supported.
    #   key   = ansible_facts['distribution']
    #   value = allowed ansible_facts['distribution_major_version'] values
    supported_platforms:
      Fedora:
        - "44"
      Ubuntu:
        - "26"

  pre_tasks:
    - name: Load OS-specific variables
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', os_vars) }}"
      vars:
        os_vars:
          files:
            - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
            - "{{ ansible_facts['distribution'] }}.yml"
            - "{{ ansible_facts['os_family'] }}.yml"
            - default.yml
          paths:
            - vars/os
      tags: [always]

    - name: Assert the host is a supported platform
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in supported_platforms
          - ansible_facts['distribution_major_version'] in supported_platforms[ansible_facts['distribution']]
        fail_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          is not supported. Supported platforms: {{ supported_platforms }}
        success_msg: >-
          Configuring {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['os_family'] }} family)
      tags: [always]
      
    - name: Verify connectivity
      ansible.builtin.ping:
      tags: [always]

  roles:
    - {role: base,       tags: [base]}
    - {role: fonts,      tags: [fonts]}
    - {role: git,        tags: [git]}
    #- {role: neovim,     tags: [editors, neovim]}
    #- {role: tmux,       tags: [tmux]}
    #- {role: alacritty,  tags: [terminal, alacritty]}
    #- {role: flatpak,    tags: [flatpak]}
    #- {role: gnome,      tags: [desktop, gnome]}
    #- {role: containers, tags: [containers, podman]}
    #- {role: vscode,     tags: [editors, vscode]}
    #- {role: hashicorp,  tags: [hashicorp]}
    #- {role: awscli,     tags: [awscli]}
    #- {role: github,     tags: [github]}
