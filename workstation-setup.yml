#!/usr/bin/ansible-playbook --ask-become-pass
---
- name: Configure workstation
  hosts: localhost
  connection: local

  vars:
    workstation_user: jrh
    workstation_group: jrh
    hostname: fedora

    # Platforms this playbook claims to support.
    #   key   = ansible_facts['distribution']
    #   value = allowed ansible_facts['distribution_major_version'] values
    # Ubuntu is listed as LTS-only on purpose; interim releases are not tested.
    supported_platforms:
      Fedora:
        - "44"
      Ubuntu:
        - "26"

  pre_tasks:
    - name: Load OS-specific variables
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', os_vars) }}"
      vars:
        os_vars:
          files:
            - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
            - "{{ ansible_facts['distribution'] }}.yml"
            - "{{ ansible_facts['os_family'] }}.yml"
            - default.yml
          paths:
            - vars/os
      tags: [always]

    - name: Assert the host is a supported platform
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in supported_platforms
          - ansible_facts['distribution_major_version'] in supported_platforms[ansible_facts['distribution']]
        fail_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          is not supported. Supported platforms: {{ supported_platforms }}
        success_msg: >-
          Configuring {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['os_family'] }} family)
      tags: [always]

    - name: Verify connectivity
      ansible.builtin.ping:
      tags: [always]

  tasks:
    # ------------------------------------------------------------------
    # Portable across every supported platform
    # ------------------------------------------------------------------
    - name: Set hostname
      ansible.builtin.import_tasks: tasks/set_hostname.yml
      tags: [hostname]

    - name: Install common command line utilities
      ansible.builtin.import_tasks: tasks/command_line_utilities.yml
      tags: [packages, cli]

    - name: Add flathub repo to flatpak remotes
      ansible.builtin.import_tasks: tasks/add_flathub_remote.yml
      tags: [flatpak]

    - name: Install common flatpak applications
      ansible.builtin.import_tasks: tasks/common_flatpak_applications.yml
      tags: [flatpak, apps]

    - name: Configure GNOME settings
      ansible.builtin.import_tasks: tasks/gnome_settings.yml
      tags: [desktop, gnome]

    - name: Install and configure Neovim
      ansible.builtin.import_tasks: tasks/neovim.yml
      tags: [packages, editors, neovim]

    - name: Install and configure git
      ansible.builtin.import_tasks: tasks/git_configuration.yml
      tags: [packages, git]

    - name: Install and configure tmux
      ansible.builtin.import_tasks: tasks/tmux.yml
      tags: [packages, tmux]

    - name: Install and configure Alacritty terminal
      ansible.builtin.import_tasks: tasks/alacritty_tasks.yml
      tags: [packages, terminal, alacritty]

    # ------------------------------------------------------------------
    # Red Hat family only, until a Debian equivalent exists
    # ------------------------------------------------------------------
    - name: Red Hat family specific configuration
      when: ansible_facts['os_family'] == "RedHat"
      tags: [redhat]
      block:
        - name: Configure GNOME terminal (Ptyxis)
          ansible.builtin.import_tasks: tasks/gnome_terminal.yml
          tags: [desktop, gnome, terminal]

        - name: Enable support for containers (Podman)
          ansible.builtin.import_tasks: tasks/podman.yml
          tags: [packages, containers, podman]

        - name: Install GitHub applications
          ansible.builtin.import_tasks: tasks/github.yml
          tags: [packages, github]

        - name: Install Visual Studio Code
          ansible.builtin.import_tasks: tasks/vscode.yml
          tags: [packages, editors, vscode]

        - name: Install Hashicorp applications (Packer, Terraform, Vagrant)
          ansible.builtin.import_tasks: tasks/hashicorp.yml
          tags: [packages, hashicorp]

        - name: Install and configure Amazon Web Services CLI tool
          ansible.builtin.import_tasks: tasks/awscli.yml
          tags: [packages, awscli]

        - name: Install and configure Logitech Software
          ansible.builtin.import_tasks: tasks/logitech.yml
          tags: [packages, peripherals, logitech]

        - name: Install and configure yazi
          ansible.builtin.import_tasks: tasks/yazi.yml
          tags: [packages, yazi]

    # ------------------------------------------------------------------
    # Debian family - port targets tracked in vars/os/Debian.yml
    # ------------------------------------------------------------------
    - name: Debian family specific configuration
      when: ansible_facts['os_family'] == "Debian"
      tags: [debian]
      block:
        - name: Report unported task groups
          ansible.builtin.debug:
            msg: >-
              Not yet ported to {{ ansible_facts['distribution'] }}:
              {{ debian_port_todo | join(', ') }}

    - name: Enable and start sshd service
      become: true
      ansible.builtin.systemd_service:
        name: "{{ svc_sshd }}"
        state: started
        enabled: true
      tags: [services, ssh]
